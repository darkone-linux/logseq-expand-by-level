name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install
      - run: pnpm build
      - name: Package plugin
        run: cd dist && zip -r ../logseq-expend-by-level.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: logseq-expend-by-level.zip
